<svg viewBox="0 0 1440 960" xmlns="http://www.w3.org/2000/svg" font-family="'Yu Gothic','Noto Sans JP','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="960" fill="#ffffff"/>
  <text x="720" y="20" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Council 全体アーキテクチャ</text>
  <text x="720" y="38" text-anchor="middle" font-size="11.5" fill="#666">権限は上から下へ委譲され、正本データは下から上へは戻らない（役割・Skillの詳細は README の一覧表を参照）</text>

  <!-- Layer 1: Human  y=66-124 -->
  <rect x="40" y="66" width="1290" height="58" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="58" y="88" font-size="15" font-weight="700" fill="#a32c20">人間</text>
  <text x="58" y="108" font-size="11.5" fill="#5a2018">最終採否の決定・不可逆操作の承認・maintenance例外の承認</text>

  <!-- gap1: 124-174 (50px), two offset one-way arrows instead of a bidirectional marker (avoids marker overlap on a short line) -->
  <line x1="138" y1="132" x2="138" y2="164" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="162" y1="164" x2="162" y2="132" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="176" y="153" font-size="11.5" fill="#222">依頼 ／ 評議会推奨の提示</text>

  <!-- Layer 2: Orchestrator  y=174-232 -->
  <rect x="40" y="174" width="1290" height="58" rx="10" fill="#eaf0f6" stroke="#2c3e50" stroke-width="2"/>
  <text x="58" y="196" font-size="15" font-weight="700" fill="#1c2c3c">council-runner / council-orchestrator（自律統括）</text>
  <text x="58" y="216" font-size="11.5" fill="#2c3e50">正式決定と不可逆操作は行わない。審議予算内で追加調査・再反証・再監査を自律判断</text>

  <!-- gap2: 232-282 (50px), two offset one-way arrows -->
  <line x1="138" y1="240" x2="138" y2="272" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="162" y1="272" x2="162" y2="240" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="176" y="261" font-size="11.5" fill="#222">工程の呼び出し ／ 出力の回収</text>

  <!-- Layer 3: Execution (Subagent + Skill)  y=282-478 -->
  <rect x="40" y="282" width="1290" height="196" rx="10" fill="#eef7f1" stroke="#27633f" stroke-width="2"/>
  <text x="58" y="304" font-size="14" font-weight="700" fill="#1e4c32">実行層</text>

  <text x="58" y="324" font-size="12" font-weight="700" fill="#1e4c32">Subagent（独立コンテキストでの視点）</text>
  <g font-size="12">
    <rect x="58" y="332" width="242" height="42" rx="6" fill="#ffffff" stroke="#27633f"/>
    <text x="179" y="349" text-anchor="middle" font-weight="700" fill="#1e4c32">chair</text>
    <text x="179" y="365" text-anchor="middle" fill="#333" font-size="10.5">主査・論点整理</text>

    <rect x="312" y="332" width="242" height="42" rx="6" fill="#ffffff" stroke="#27633f"/>
    <text x="433" y="349" text-anchor="middle" font-weight="700" fill="#1e4c32">researcher</text>
    <text x="433" y="365" text-anchor="middle" fill="#333" font-size="10.5">調査役・一次資料</text>

    <rect x="566" y="332" width="242" height="42" rx="6" fill="#ffffff" stroke="#27633f"/>
    <text x="687" y="349" text-anchor="middle" font-weight="700" fill="#1e4c32">critic</text>
    <text x="687" y="365" text-anchor="middle" fill="#333" font-size="10.5">反対役・反証</text>

    <rect x="820" y="332" width="242" height="42" rx="6" fill="#ffffff" stroke="#27633f"/>
    <text x="941" y="349" text-anchor="middle" font-weight="700" fill="#1e4c32">secretary</text>
    <text x="941" y="365" text-anchor="middle" fill="#333" font-size="10.5">書記・議事録案</text>

    <rect x="1074" y="332" width="242" height="42" rx="6" fill="#ffffff" stroke="#27633f"/>
    <text x="1195" y="349" text-anchor="middle" font-weight="700" fill="#1e4c32">content-auditor</text>
    <text x="1195" y="365" text-anchor="middle" fill="#333" font-size="10.5">独立監査</text>
  </g>

  <line x1="58" y1="384" x2="1316" y2="384" stroke="#bcd8c7" stroke-width="1"/>

  <text x="58" y="402" font-size="12" font-weight="700" fill="#1e4c32">Skill（定型手続き。各工程はJSON正本を runs/private/ に出力）</text>
  <g font-size="11.5">
    <rect x="58" y="410" width="242" height="30" rx="5" fill="#ffffff" stroke="#5b3a8e"/>
    <text x="179" y="430" text-anchor="middle" fill="#3d2563">issue-intake</text>
    <rect x="312" y="410" width="242" height="30" rx="5" fill="#ffffff" stroke="#5b3a8e"/>
    <text x="433" y="430" text-anchor="middle" fill="#3d2563">chair-review</text>
    <rect x="566" y="410" width="242" height="30" rx="5" fill="#ffffff" stroke="#5b3a8e"/>
    <text x="687" y="430" text-anchor="middle" fill="#3d2563">web-research</text>
    <rect x="820" y="410" width="242" height="30" rx="5" fill="#ffffff" stroke="#5b3a8e"/>
    <text x="941" y="430" text-anchor="middle" fill="#3d2563">devil-advocate</text>
    <rect x="1074" y="410" width="242" height="30" rx="5" fill="#ffffff" stroke="#5b3a8e"/>
    <text x="1195" y="430" text-anchor="middle" fill="#3d2563">secretary</text>

    <rect x="58" y="444" width="242" height="30" rx="5" fill="#ffffff" stroke="#5b3a8e"/>
    <text x="179" y="464" text-anchor="middle" fill="#3d2563">formal-validation</text>
    <rect x="312" y="444" width="242" height="30" rx="5" fill="#ffffff" stroke="#5b3a8e"/>
    <text x="433" y="464" text-anchor="middle" fill="#3d2563">content-audit</text>
    <rect x="566" y="444" width="242" height="30" rx="5" fill="#ffffff" stroke="#5b3a8e"/>
    <text x="687" y="464" text-anchor="middle" fill="#3d2563">final-synthesis</text>
    <rect x="820" y="444" width="242" height="30" rx="5" fill="#ffffff" stroke="#5b3a8e"/>
    <text x="941" y="464" text-anchor="middle" fill="#3d2563">council-runner</text>
    <rect x="1074" y="444" width="242" height="30" rx="5" fill="#fff3e0" stroke="#b8860b"/>
    <text x="1195" y="464" text-anchor="middle" fill="#7a5300" font-weight="700">approved-memory-update</text>
  </g>

  <!-- gap3: 478-528 (50px), one-way: execution -> hook -->
  <line x1="150" y1="484" x2="150" y2="522" stroke="#222" stroke-width="2.6" marker-end="url(#arrow)"/>
  <text x="164" y="507" font-size="11.5" fill="#222">検査を受ける</text>

  <!-- Layer 4: Hook  y=528-598 -->
  <rect x="40" y="528" width="1290" height="70" rx="10" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <text x="58" y="550" font-size="14" font-weight="700" fill="#333">Hook（hooks/validate.py）— 機械的検査。内容の正しさ自体は保証しない</text>
  <g font-size="12">
    <rect x="58" y="558" width="304" height="30" rx="5" fill="#ffffff" stroke="#555"/>
    <text x="210" y="578" text-anchor="middle" fill="#333">pre-run</text>
    <rect x="374" y="558" width="304" height="30" rx="5" fill="#ffffff" stroke="#555"/>
    <text x="526" y="578" text-anchor="middle" fill="#333">pre-tool-use</text>
    <rect x="690" y="558" width="304" height="30" rx="5" fill="#ffffff" stroke="#555"/>
    <text x="842" y="578" text-anchor="middle" fill="#333">post-tool-use</text>
    <rect x="1006" y="558" width="304" height="30" rx="5" fill="#ffffff" stroke="#555"/>
    <text x="1158" y="578" text-anchor="middle" fill="#333">pre-decision</text>
  </g>

  <!-- gap4: 598-648 (50px), two offset one-way arrows -->
  <line x1="138" y1="606" x2="138" y2="638" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="162" y1="638" x2="162" y2="606" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="176" y="627" font-size="11.5" fill="#222">読み書き</text>

  <!-- Layer 5: Data  y=648-942, gaps widened to 30px so arrows read as lines, not dots; extra bottom margin so the formal-record box doesn't crowd the frame -->
  <rect x="40" y="648" width="1290" height="294" rx="10" fill="#fafafa" stroke="#888" stroke-width="2"/>
  <text x="58" y="670" font-size="14" font-weight="700" fill="#1a1a1a">データ（一方向の正本経路：設定 → 実行状態 → 成果物 → 正式記録）</text>

  <rect x="58" y="680" width="1254" height="42" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,3"/>
  <text x="72" y="705" font-size="12.5"><tspan font-weight="700" fill="#a32c20">設定・ルール（Hookが書込みBLOCK）</tspan><tspan fill="#5a2018">　CLAUDE.md・AGENTS.md・ROLE_RULES.md・DECISION_RULES.md・HOOKS.md・SKILL_CONTRACT.md</tspan></text>

  <line x1="700" y1="726" x2="700" y2="748" stroke="#888" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="58" y="752" width="1254" height="40" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.6"/>
  <text x="72" y="776" font-size="12.5"><tspan font-weight="700" fill="#7a5300">実行状態（Git非公開）</tspan><tspan fill="#5a4300">　.council/active_run.json — status／current_stage／outputs／deliberation_budget／counters</tspan></text>

  <line x1="700" y1="796" x2="700" y2="818" stroke="#888" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="58" y="822" width="1254" height="40" rx="6" fill="#f2f2f2" stroke="#555555" stroke-width="1.6"/>
  <text x="72" y="846" font-size="12.5"><tspan font-weight="700" fill="#333">成果物（Git非公開）</tspan><tspan fill="#444">　runs/private/&lt;RUN-ID&gt;/attempt-&lt;NN&gt;/&lt;skill&gt;.json（正本）＋ 同名 .md</tspan></text>

  <text x="1080" y="872" font-size="10.5" fill="#a32c20" text-anchor="end">↓直結せず、右の承認ループ経由でのみ書込み可</text>

  <rect x="58" y="876" width="1254" height="34" rx="6" fill="#e8f5ee" stroke="#27633f" stroke-width="1.6"/>
  <text x="72" y="897" font-size="12.5"><tspan font-weight="700" fill="#1e4c32">正式記録（人間承認後のみ・Git公開対象）</tspan><tspan fill="#204832">　records/adopted・pending・rejected/&lt;DECISION-ID&gt;.md</tspan></text>

  <!-- Human -> formal record, approval-only path, right edge -->
  <path d="M 1330 95 L 1410 95 L 1410 893 L 1330 893" stroke="#c0392b" stroke-width="3" fill="none" stroke-linecap="square" stroke-dasharray="12,7" marker-end="url(#arrowDash)"/>
  <text x="1418" y="494" font-size="12" fill="#a32c20" transform="rotate(90 1418 494)" text-anchor="middle">承認後のみ（approved-memory-update）</text>
</svg>
