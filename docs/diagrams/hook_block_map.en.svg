<svg viewBox="0 0 1440 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="620" fill="#ffffff"/>

  <text x="720" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Skeleton of Hook checks (hooks/validate.py)</text>
  <text x="720" y="48" text-anchor="middle" font-size="12.5" fill="#666">Shows only the 4 execution points and their outcomes. See the README table for the full finding-code list</text>

  <!-- Column frames: width 277, 70px gap reserved for arrows -->
  <rect x="60" y="70" width="277" height="290" rx="10" fill="#fafafa" stroke="#555" stroke-width="1.6"/>
  <rect x="407" y="70" width="277" height="290" rx="10" fill="#fafafa" stroke="#555" stroke-width="1.6"/>
  <rect x="754" y="70" width="277" height="290" rx="10" fill="#fafafa" stroke="#555" stroke-width="1.6"/>
  <rect x="1101" y="70" width="277" height="290" rx="10" fill="#fafafa" stroke="#555" stroke-width="1.6"/>

  <!-- inter-column arrows -->
  <line x1="341" y1="95" x2="403" y2="95" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="372" y="115" text-anchor="middle" font-size="10" fill="#555">on start</text>

  <line x1="688" y1="95" x2="750" y2="95" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="719" y="115" text-anchor="middle" font-size="10" fill="#555">if allowed</text>

  <line x1="1035" y1="95" x2="1097" y2="95" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="1066" y="115" text-anchor="middle" font-size="10" fill="#555">after check</text>

  <!-- Column 1: pre-run -->
  <text x="78" y="98" font-size="14.5" font-weight="700" fill="#1c2c3c">pre-run</text>
  <text x="78" y="114" font-size="10.5" fill="#666">Trigger: SessionStart</text>
  <text x="78" y="136" font-size="11" fill="#333">Checks: required files, canonical</text>
  <text x="78" y="150" font-size="11" fill="#333">STATE, private dirs, git-ignore, id registry</text>

  <rect x="78" y="160" width="241" height="24" rx="4" fill="#e8f5ee" stroke="#27633f"/>
  <text x="198" y="176" text-anchor="middle" font-size="10.5" fill="#1e4c32">PASS／WARNING－continue startup</text>

  <rect x="78" y="188" width="241" height="26" rx="4" fill="#fdf1e6" stroke="#c9791a"/>
  <text x="198" y="205" text-anchor="middle" font-size="10.5" fill="#8a4a00">FAIL－can't start; fix the file(s)</text>

  <rect x="78" y="218" width="241" height="26" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="198" y="235" text-anchor="middle" font-size="10.3" fill="#a32c20">BLOCK－fix private git-ignore</text>

  <!-- Column 2: pre-tool-use -->
  <text x="425" y="98" font-size="14.5" font-weight="700" fill="#1c2c3c">pre-tool-use</text>
  <text x="425" y="114" font-size="10.5" fill="#666">Trigger: before Write/Edit/Bash</text>
  <text x="425" y="136" font-size="11" fill="#333">Checks: protected files, secret</text>
  <text x="425" y="150" font-size="11" fill="#333">patterns, destructive commands, paths</text>

  <rect x="425" y="160" width="241" height="24" rx="4" fill="#e8f5ee" stroke="#27633f"/>
  <text x="545" y="176" text-anchor="middle" font-size="10.5" fill="#1e4c32">PASS－write／exec allowed</text>

  <rect x="425" y="188" width="241" height="44" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="545" y="205" text-anchor="middle" font-size="10.5" fill="#a32c20">BLOCK－execution refused</text>
  <text x="545" y="221" text-anchor="middle" font-size="9.3" fill="#7a4038">(unless a maintenance approval applies)</text>

  <!-- Column 3: post-tool-use -->
  <text x="772" y="98" font-size="14.5" font-weight="700" fill="#1c2c3c">post-tool-use</text>
  <text x="772" y="114" font-size="10.5" fill="#666">Trigger: after the same tools</text>
  <text x="772" y="136" font-size="11" fill="#333">Checks: none (logs, doesn't check)</text>

  <rect x="772" y="160" width="241" height="52" rx="4" fill="#f2f2f2" stroke="#555"/>
  <text x="892" y="177" text-anchor="middle" font-size="10.5" fill="#333">Always PASS</text>
  <text x="892" y="193" text-anchor="middle" font-size="9.3" fill="#444">Detects only a completed maintenance</text>
  <text x="892" y="207" text-anchor="middle" font-size="9.3" fill="#444">approval; logs before/after hash + time</text>

  <path d="M 940 240 q 90 40 0 80" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="892" y="290" text-anchor="middle" font-size="10" fill="#777">Repeats with pre-tool-use</text>
  <text x="892" y="303" text-anchor="middle" font-size="10" fill="#777">for as long as stages continue</text>

  <!-- Column 4: pre-decision -->
  <text x="1119" y="98" font-size="14.5" font-weight="700" fill="#1c2c3c">pre-decision</text>
  <text x="1119" y="114" font-size="10.5" fill="#666">Trigger: Stop (each time a turn ends)</text>
  <text x="1119" y="136" font-size="11" fill="#333">Checks: state transitions, artifacts,</text>
  <text x="1119" y="150" font-size="11" fill="#333">deliberation budget, completion consistency</text>

  <rect x="1119" y="160" width="241" height="24" rx="4" fill="#e8f5ee" stroke="#27633f"/>
  <text x="1239" y="176" text-anchor="middle" font-size="10.5" fill="#1e4c32">PASS－turn may end</text>

  <rect x="1119" y="188" width="241" height="40" rx="4" fill="#fdf1e6" stroke="#c9791a"/>
  <text x="1239" y="204" text-anchor="middle" font-size="10.5" fill="#8a4a00">FAIL－fix the target and</text>
  <text x="1239" y="219" text-anchor="middle" font-size="10.5" fill="#8a4a00">retry within the same turn</text>

  <rect x="1119" y="232" width="241" height="58" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="1239" y="248" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a32c20">BLOCK－turn may not end</text>
  <text x="1239" y="263" text-anchor="middle" font-size="9.3" fill="#7a4038">unresolved audit／budget not spent／</text>
  <text x="1239" y="277" text-anchor="middle" font-size="9.3" fill="#7a4038">still RUNNING at stop, etc.</text>

  <!-- Bottom notes -->
  <rect x="60" y="376" width="640" height="76" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  <text x="76" y="398" font-size="12" font-weight="700" fill="#333">FAIL is not a stop</text>
  <text x="76" y="416" font-size="11" fill="#444">It fixes the target data/stage and retries within</text>
  <text x="76" y="432" font-size="11" fill="#444">the same turn. Only BLOCK halts across turns.</text>

  <rect x="740" y="376" width="640" height="76" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  <text x="756" y="398" font-size="12" font-weight="700" fill="#333">Only pre-decision gates ending the RUN itself</text>
  <text x="756" y="416" font-size="11" fill="#444">Ending a turn while status=RUNNING is blocked.</text>
  <text x="756" y="432" font-size="11" fill="#444">Stopping to await "permission for the next stage" is disallowed by design.</text>

  <!-- Human stop conditions -->
  <rect x="60" y="466" width="1320" height="130" rx="10" fill="#eef7f1" stroke="#27633f" stroke-width="1.8"/>
  <text x="78" y="490" font-size="13" font-weight="700" fill="#1e4c32">Conditions that may stop for a human (WAITING_FOR_HUMAN) — Hook checks only the escalation object's form</text>

  <g font-size="11" fill="#1e4c32">
    <rect x="78" y="502" width="240" height="30" rx="14" fill="#ffffff" stroke="#27633f"/>
    <text x="198" y="521" text-anchor="middle">HUMAN_ONLY_INFORMATION</text>
    <rect x="330" y="502" width="200" height="30" rx="14" fill="#ffffff" stroke="#27633f"/>
    <text x="430" y="521" text-anchor="middle">CONSTRAINT_CONFLICT</text>
    <rect x="542" y="502" width="200" height="30" rx="14" fill="#ffffff" stroke="#27633f"/>
    <text x="642" y="521" text-anchor="middle">IRREVERSIBLE_ACTION</text>
    <rect x="754" y="502" width="290" height="30" rx="14" fill="#ffffff" stroke="#27633f"/>
    <text x="899" y="521" text-anchor="middle">LEGAL_OR_ORGANIZATIONAL_AUTHORITY</text>
    <rect x="1056" y="502" width="180" height="30" rx="14" fill="#ffffff" stroke="#27633f"/>
    <text x="1146" y="521" text-anchor="middle">VALUE_CONFLICT</text>
  </g>

  <text x="78" y="548" font-size="11" fill="#204832">Anything else (unresolved unknowns, lack of hands-on verification, conflicting evidence, tied alternatives, dissent, low confidence,</text>
  <text x="78" y="565" font-size="11" fill="#204832">room for more research) is not, on its own, a reason to stop — it is handled autonomously as a conditional conclusion.</text>
  <text x="78" y="586" font-size="10.3" fill="#3a6a4d" font-style="italic">The full FAIL／BLOCK finding-code list and the judgment↔behavior table are in the README.</text>
</svg>
